server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: ${LOKI_URL}

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_label_com_example_env]
        target_label: env
      - source_labels: [__meta_docker_container_label_com_example_service]
        target_label: service
    pipeline_stages:
      - json:
          expressions:
            level: level
            trace_id: trace_id
            message: message
            service: service
            env: env
      - labels:
          level:
          service:
          env:
          trace_id:

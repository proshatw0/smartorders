services:
  user-db:
    image: postgres:16
    container_name: user-svc-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ${USER_SVC_DB_NAME}
      USER_SVC_DB_USER: ${USER_SVC_DB_USER}
      USER_SVC_DB_PASSWORD: ${USER_SVC_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
      - user-db_data:/var/lib/postgresql/data

  user-svc:
    build:
      context: ./..
      dockerfile: Dockerfile
    depends_on:
      - user-db
    env_file: .env
    environment:
      USER_SVC_DB_USER: ${USER_SVC_DB_USER}
      USER_SVC_DB_PASSWORD: ${USER_SVC_DB_PASSWORD}
    ports:
      - "${USER_SVC_PORT}:${USER_SVC_PORT}"
    restart: unless-stopped

volumes:
  user-db_data:
